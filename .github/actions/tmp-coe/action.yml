name: "tmp coe probe"
description: "probe continue-on-error + steps.<id>.outcome inside a composite action"
inputs:
  should_fail:
    required: true
runs:
  using: "composite"
  steps:
    - name: Build
      id: build
      continue-on-error: ${{ inputs.should_fail == 'true' }}
      shell: bash
      run: |
        if [ "${{ inputs.should_fail }}" = "true" ]; then
          echo "PROBE: build failing on purpose"
          exit 1
        fi
        echo "PROBE: build succeeded"

    - name: Resolve
      if: ${{ steps.build.outcome == 'failure' }}
      shell: bash
      run: echo "PROBE: RESOLVE_RAN outcome=${{ steps.build.outcome }}"

    - name: Always
      shell: bash
      run: echo "PROBE: reached end, outcome=${{ steps.build.outcome }} conclusion=${{ steps.build.conclusion }}"
